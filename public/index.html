<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Proxy Browser</title><link rel="stylesheet" href="style.css"></head><body><div class="browser"><header class="chrome"><div class="tab-strip"><div class="tabs" id="tabs"></div><button class="new-tab" id="newTab" type="button" title="New tab">+</button><div class="window-actions"><button type="button">—</button><button type="button">□</button><button type="button">×</button></div></div><div class="toolbar"><div class="nav-buttons"><button id="back" type="button" title="Back">←</button><button id="forward" type="button" title="Forward">→</button><button id="reload" type="button" title="Reload">↻</button><button id="home" type="button" title="Home">⌂</button></div><form id="addressForm" class="address-wrap" onsubmit="return window.proxyFallback(document.getElementById('address').value)"><span class="site-icon">⌕</span><input id="address" autocomplete="off" spellcheck="false" placeholder="Search or enter a web address"><button type="submit" class="go">Go</button></form><button id="theme" class="theme" type="button" title="Toggle light/dark theme">☀</button></div></header><main class="viewport"><div id="homePage" class="home-page"><div class="home-logo"><span>↗</span></div><h1>Web Proxy</h1><p>Browse the web through your proxy.</p><form id="homeForm" class="home-search" onsubmit="return window.proxyFallback(document.getElementById('homeInput').value)"><input id="homeInput" placeholder="Search or enter a web address" autocomplete="url"><button type="submit">Go</button></form><p id="error" class="error" hidden></p></div><iframe id="frame" title="Proxy browser" hidden></iframe></main></div><script src="app.js?v=20261002-2"></script><script>window.proxyFallback=function(value){value=String(value||"").trim();if(!value)return false;if(!/^https?:\/\//i.test(value))value="https://"+value;try{var u=new URL(value);if(!/^https?:$/.test(u.protocol))throw new Error();var f=document.getElementById("frame"),h=document.getElementById("homePage"),e=document.getElementById("error");f.src="/proxy?url="+encodeURIComponent(u.href);h.hidden=true;f.hidden=false;if(e){e.hidden=true;e.textContent=""}return false}catch(err){var e2=document.getElementById("error");if(e2){e2.textContent="Enter a valid web address, such as example.com.";e2.hidden=false}return false}};</script></body></html>
