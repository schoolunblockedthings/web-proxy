<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Proxy Browser</title><link rel="stylesheet" href="style.css"></head><body><div class="browser"><header class="chrome"><div class="tab-strip"><div class="tabs" id="tabs"></div><button class="new-tab" id="newTab" title="New tab">+</button><div class="window-actions"><button>—</button><button>□</button><button>×</button></div></div><div class="toolbar"><div class="nav-buttons"><button id="back" title="Back">←</button><button id="forward" title="Forward">→</button><button id="reload" title="Reload">↻</button><button id="home" title="Home">⌂</button></div><form id="addressForm" class="address-wrap"><span class="site-icon">⌕</span><input id="address" autocomplete="off" spellcheck="false" placeholder="Search or enter a web address"><button type="submit" class="go">Go</button></form><button id="theme" class="theme" title="Toggle light/dark theme">☀</button></div></header><main class="viewport"><div id="homePage" class="home-page"><div class="home-logo"><span>↗</span></div><h1>Web Proxy</h1><p>Browse the web through your proxy.</p><form id="homeForm" class="home-search"><input id="homeInput" placeholder="Search or enter a web address" autocomplete="url"><button>Go</button></form><p id="error" class="error" hidden></p></div><iframe id="frame" title="Proxy browser" hidden></iframe></main></div><script src="app.js"></script></body></html>
